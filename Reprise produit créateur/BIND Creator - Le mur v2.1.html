    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

    // local text and treats a miss as authoritative — never relaying to

    const resourceBlobs = {};

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e22605f6-e08d-4e70-a97b-f1b186365c4f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"94d09180-a547-42c9-a5f5-f8e82c02249f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e22605f6-e08d-4e70-a97b-f1b186365c4f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"94d09180-a547-42c9-a5f5-f8e82c02249f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #EDE6DE; }\n  a { color: #A83E06; text-decoration: none; }\n  a:hover { color: #5E2204; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"display:flex; flex-direction:column; gap:40px; padding:56px 56px 0; font-family:'Outfit',sans-serif;\">\n\n  <div style=\"background:#17120E; padding:48px 52px; display:flex; flex-direction:column; gap:28px;\">\n    <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:40px;\">\n      <div style=\"display:flex; align-items:baseline; font-size:32px; line-height:32px; font-weight:300; letter-spacing:1px;\"><span style=\"color:#FFFFFF;\">B<\u002Fspan><span style=\"color:#F26B21;\">!<\u002Fspan><span style=\"color:#FFFFFF;\">ND<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1.4px; color:#9A8D80;\">LE MUR · v2.1 · SPÉCIFICATION COMPLÈTE<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:16px; max-width:900px;\">\n      <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px;\">\n        <span style=\"font-family:'Bodoni Moda',Didot,'Playfair Display',Georgia,serif; font-size:46px; line-height:56px; font-weight:400; color:#FFFFFF;\">Un cycle de six, qui ne se<\u002Fspan>\n        <span style=\"font-family:'Bodoni Moda',Didot,'Playfair Display',Georgia,serif; font-style:italic; font-size:46px; line-height:56px; font-weight:500; color:#F58A4A;\">devine pas<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:17px; line-height:27px; color:#CFC3B6; max-width:780px; text-wrap:pretty;\">L'alternance de la première passe était une intention. Ici elle devient une règle : <span style=\"font-weight:600;\">six positions, un ordre fixe, qui se répète<\u002Fspan>. Le pouce apprend le rythme sans le remarquer, et personne n'a à décider quel salon mérite le grand format — la position le décide.<\u002Fdiv>\n      <div style=\"font-size:15px; line-height:24px; color:#9A8D80; max-width:780px; text-wrap:pretty;\">Six cadres : chargement, haut du fil, le cycle complet en deux écrans, la respiration, le vide, et le bas des vingt.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:0; flex-wrap:wrap; border:1px solid #3A3128;\">\n      <div style=\"flex:1; min-width:280px; box-sizing:border-box; border-right:1px solid #3A3128; padding:22px 24px; display:flex; flex-direction:column; gap:8px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.2px; color:#F58A4A;\">LA RÈGLE<\u002Fdiv>\n        <div style=\"font-size:16px; line-height:24px; font-weight:600; color:#FFFFFF;\">Huit salons, puis une respiration<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:21px; color:#9A8D80; text-wrap:pretty;\">Un cycle porte huit salons répartis sur cinq blocs, et se referme sur un panneau os. Vingt salons font donc deux cycles pleins et un dernier partiel — le fil se termine sur un bloc complet, jamais sur une moitié orpheline.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1; min-width:280px; box-sizing:border-box; border-right:1px solid #3A3128; padding:22px 24px; display:flex; flex-direction:column; gap:8px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.2px; color:#F58A4A;\">LE TRI, ET CE QU'IL DEVIENT<\u002Fdiv>\n        <div style=\"font-size:16px; line-height:24px; font-weight:600; color:#FFFFFF;\">La distance ordonne, la position met en valeur<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:21px; color:#9A8D80; text-wrap:pretty;\">Les salons arrivent par distance croissante et se posent dans les positions du cycle. Le plus proche tombe donc en position 1, la plus grande — c'est un effet du tri, pas une mise en avant à décider. Aucun classement éditorial, aucun salon promu.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1; min-width:280px; box-sizing:border-box; padding:22px 24px; display:flex; flex-direction:column; gap:8px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.2px; color:#F58A4A;\">LE DIDONE<\u002Fdiv>\n        <div style=\"font-size:16px; line-height:24px; font-weight:600; color:#FFFFFF;\">Une fois tous les huit salons<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:21px; color:#9A8D80; text-wrap:pretty;\">Il n'apparaît que sur le panneau de respiration et sur le bas du fil. Sur environ trois hauteurs d'écran de photos, on en croise un. C'est l'intensité que je propose pour un écran ouvert dix fois par jour.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:16px;\">\n    <div style=\"display:flex; flex-direction:column; gap:6px; max-width:840px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1.4px; color:#6B5F54;\">LE CYCLE<\u002Fdiv>\n      <div style=\"font-family:'Bodoni Moda',Didot,'Playfair Display',Georgia,serif; font-size:32px; line-height:40px; font-weight:400; color:#17120E;\">Six positions, dans cet ordre<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;\">\n      <div style=\"display:flex; flex-direction:column; gap:8px; width:158px;\">\n        <div style=\"box-sizing:border-box; width:158px; height:210px; background:#9A8D80; border:1px solid #E2D9CF; display:flex; align-items:flex-end; padding:8px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.8px; color:#FFFFFF;\">1 SALON<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:1px;\"><span style=\"font-size:14px; line-height:19px; font-weight:600; color:#17120E;\">1 · Héros<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B5F54;\">520 PX<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px; width:158px;\">\n        <div style=\"box-sizing:border-box; width:158px; height:96px; display:flex; gap:3px;\">\n          <div style=\"flex:1; background:#B8AA9C; border:1px solid #E2D9CF;\"><\u002Fdiv>\n          <div style=\"flex:1; background:#B8AA9C; border:1px solid #E2D9CF;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:1px;\"><span style=\"font-siz 40px; line-height:46px; font-weight:400; color:#17120E; text-wrap:pretty;\">Nothing this close<\u002Fspan>\n            <span style=\"font-size:15px; line-height:23px; color:#3A3128; text-wrap:pretty;\">Your tiers are open. There is simply no business offering them within 15 km.<\u002Fspan>\n            <div style=\"display:flex; flex-direction:column; gap:8px; padding-top:2px;\">\n              <div style=\"box-sizing:border-box; height:48px; background:#F26B21; padding:0 16px; display:flex; align-items:center; justify-content:space-between;\">\n                <span style=\"font-size:15px; line-height:20px; font-weight:600; color:#17120E;\">Widen to 30 km<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.8px; color:#17120E;\">9<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"box-sizing:border-box; height:48px; border:1px solid #17120E; padding:0 16px; display:flex; align-items:center; justify-content:space-between;\">\n                <span style=\"font-size:15px; line-height:20px; font-weight:600; color:#17120E;\">Widen to 50 km<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.8px; color:#17120E;\">24<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"box-sizing:border-box; flex:none; height:34px; padding:0 18px; display:flex; align-items:center;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.4px; color:#6B5F54;\">CE QUE TU VERRAIS À 30 KM<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"flex:none; height:296px; position:relative; background:linear-gradient(158deg,#FFFFFF 0%,#E0D6CA 36%,#8A7C6E 70%,#4A4038 100%);\">\n            <div style=\"position:absolute; inset:auto 0 0 0; height:60%; background:linear-gradient(to bottom, rgba(23,18,14,0) 0%, rgba(23,18,14,0.46) 54%, rgba(23,18,14,0.8 u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"box-sizing:border-box; flex:none; height:66px; background:#FFFFFF; border-top:1px solid #E2D9CF;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:390px; font-size:13px; line-height:19px; color:#6B5F54; text-wrap:pretty;\">Le vide n'est pas une page d'excuse : il tient la position 6 du cycle, puis <span style=\"font-weight:600;\">montre déjà<\u002Fspan> ce que l'élargissement donnerait. Un aperçu vaut mieux qu'une promesse — et les deux issues portent leur nombre. Les catégories gardent leur encre pleine et perdent seulement leur compte : elles restent touchables, et griser un libellé encore actif serait le bouton grisé que le système refuse.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:12px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.2px; color:#6B5F54;\">F · LE BAS DES VINGT<\u002Fdiv>\n      <div data-screen-label=\"F\" style=\"width:390px; height:844px; overflow:hidden; background:#F7F3EF; border:1px solid #E2D9CF; display:flex; flex-direction:column;\">\n        <div style=\"flex:none; height:46px;\"><\u002Fdiv>\n        <div style=\"box-sizing:border-box; flex:none; height:38px; padding:0 18px; background:rgba(247,243,239,0.96); border-bottom:1px solid #E2D9CF; display:flex; align-items:center; gap:8px;\">\n          <span style=\"font-size:13px; line-height:18px; font-weight:600; color:#17120E;\">Wynwood<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.8px; color:#6B5F54;\">20 / 20<\u002Fspan>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <span style=\"font-size:13px; line-height:18px; font-weight:600; color:#A83E06;\">Filters<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:3px;\">\n          <div style=\"flex:none; height:158px; display:flex; gap:3px;\">\n            <div style=\"flex:1; position:relative; background:linear-gradient(196deg,#EDE6DE 0%,#B8AA9C 50%,#5A4E44 100%);\">\n              <div style=\"position:absolute; inset:auto 0 0 0; height:70%; background:linear-gradient(to bottom, rgba(23,18,14,0) 0%, rgba(23,18,14,0.86) 100%);\"><\u002Fdiv>\n              <div style=\"position:absolute; inset:auto 0 0 0; padding:10px; display:flex; flex-direction:column; gap:2px;\">\n                <span style=\"font-size:15px; line-height:19px; font-weight:600; color:#FFFFFF;\">Grove Massage<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1px; color:#EDE6DE;\">COCONUT GROVE · 11 KM<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1; position:relative; background:linear-gradient(136deg,#FFFFFF 0%,#C4B6A8 52%,#3A3128 100%);\">\n              <div style=\"position:absolute; inset:auto 0 0 0; height:70%; background:linear-gradient(to bottom, rgba(23,18,14,0) 0%, rgba(23,18,14,0.86) 100%);\"><\u002Fdiv>\n              <div style=\"position:absolute; inset:auto 0 0 0; padding:10px; display:flex; flex-direction:column; gap:2px;\">\n                <span style=\"font-size:15px; line-height:19px; font-weight:600; color:#FFFFFF;\">Duna Facials<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1px; color:#EDE6DE;\">MIAMI BEACH · 12 KM<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1; position:relative; background:linear-gradient(210deg,#F7F3EF 0%,#A89A8C 48%,#2E2620 100%);\">\n              <div style=\"position:absolute; inset:auto 0 0 0; height:70%; background:linear-gradient(to bottom, rgba(23,18,14,0) 0%, rgba(23,18,14,0.86) 100%);\"><\u002Fdiv>\n              <div style=\"position:absolute; inset:auto 0 0 0; padding:10px; display:flex; flex-direction:column; gap:2px;\">\n                <span style=\"font-size:15px; line-height:19px; font-weight:600; color:#FFFFFF;\">Sal &amp; Sol Spa<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1px; color:#EDE6DE;\">MIAMI BEACH · 14 KM<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"box-sizing:border-box; flex:none; height:520px; background:#17120E; padding:34px 24px; display:flex; flex-direction:column; gap:22px;\">\n            <div style=\"display:flex; flex-direction:column; gap:11px;\">\n              <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.4px; color:#9A8D80;\">TU AS TOUT VU DANS 15 KM<\u002Fspan>\n              <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px;\">\n                <span style=\"font-family:'Bodoni Moda',Didot,'Playfair Display',Georgia,serif; font-size:40px; line-height:46px; font-weight:400; color:#FFFFFF;\">Vingt salons,<\u002Fspan>\n                <span style=\"font-family:'Bodoni Moda',Didot,'Playfair Display',Georgia,serif; font-style:italic; font-size:40px; line-height:46px; font-weight:500; color:#F58A4A;\">huit quartiers<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; gap:0; border-top:1px solid #3A3128; border-bottom:1px solid #3A3128;\">\n              <div style=\"box-sizing:border-box; flex:1; border-right:1px solid #3A3128; padding:14px 0; display:flex; flex-direction:column; gap:3px;\">\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:26px; line-height:30px; font-weight:600; color:#FFFFFF;\">12<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1.1px; color:#9A8D80;\">STORY<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"box-sizing:border-box; flex:1; border-right:1px solid #3A3128; padding:14px 0 14px 16px; display:flex; flex-direction:column; gap:3px;\">\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:26px; line-height:30px; font-weight:600; color:#FFFFFF;\">6<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1.1px; color:#9A8D80;\">POST<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"box-sizing:border-box; flex:1; padding:14px 0 14px 16px; display:flex; flex-direction:column; gap:3px;\">\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:26px; line-height:30px; font-weight:600; color:#FFFFFF;\">2<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1.1px; color:#9A8D80;\">REEL<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <div style=\"box-sizing:border-box; height:52px; background:#F26B21; padding:0 18px; display:flex; align-items:center; justify-content:space-between;\">\n                <span style=\"font-size:16px; line-height:22px; font-weight:600; color:#17120E;\">Élargir à 30 km<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.8px; color:#17120E;\">+14<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"box-sizing:border-box; height:52px; border:1px solid #4F4034; padding:0 18px; display:flex; align-items:center; justify-content:space-between;\">\n                <span style=\"font-size:16px; line-height:22px; font-weight:600; color:#FFFFFF;\">Repartir du haut<\u002Fspan>\n                <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"transform:rotate(-90deg);\"><path d=\"M4.5 12h15M13.5 6l6 6-6 6\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; align-items:flex-start; gap:11px; border-top:1px solid #3A3128; padding-top:18px;\">\n              <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:none; margin-top:2px;\"><path d=\"M5.5 20v-5M12 20V9M18.5 20V4\" stroke=\"#F58A4A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"flex:1; display:flex; flex-direction:column; gap:3px;\">\n                <span style=\"font-size:15px; line-height:21px; font-weight:600; color:#FFFFFF;\">Le palier post t'ouvrirait 6 salons de plus<\u002Fspan>\n                <span style=\"font-size:13px; line-height:19px; color:#9A8D80; text-wrap:pretty;\">2 400 abonnés à atteindre sur 10 000.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"box-sizing:border-box; flex:none; height:66px; background:#FFFFFF; border-top:1px solid #E2D9CF;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:390px; font-size:13px; line-height:19px; color:#6B5F54; text-wrap:pretty;\">Le fond d'encre est le seul du fil : il ferme, là où l'os des respirations ouvrait. Il compte ce qui a été vu par palier, offre deux sorties chiffrées, et rappelle en pied ce que le prochain palier ouvrirait — la seule fois où le fil parle des paliers, et le seul endroit où c'est utile.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:14px; width:390px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.2px; color:#6B5F54;\">CE QUI TIENT L'ENSEMBLE<\u002Fdiv>\n      <div style=\"box-sizing:border-box; background:#FFFFFF; border:1px solid #E2D9CF; padding:22px 24px; display:flex; flex-direction:column; gap:9px;\">\n        <span style=\"font-size:16px; line-height:23px; font-weight:600; color:#17120E;\">Trois pixels, partout<\u002Fspan>\n        <span style=\"font-size:14px; line-height:21px; color:#3A3128; text-wrap:pretty;\">Entre deux photos, à l'horizontale comme à la verticale, y compris de part et d'autre d'une respiration. C'est la seule mesure constante de l'écran.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"box-sizing:border-box; background:#FFFFFF; border:1px solid #E2D9CF; padding:22px 24px; display:flex; flex-direction:column; gap:9px;\">\n        <span style=\"font-size:16px; line-height:23px; font-weight:600; color:#17120E;\">Une seule chose orange par photo<\u002Fspan>\n        <span style=\"font-size:14px; line-height:21px; color:#3A3128; text-wrap:pretty;\">La pastille de distance, ou le badge reel quand il y en a un. Jamais les deux en plein orange : le badge reel prend alors le pas et la distance passe en voile clair.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"box-sizing:border-box; background:#FFFFFF; border:1px solid #E2D9CF; padding:22px 24px; display:flex; flex-direction:column; gap:9px;\">\n        <span style=\"font-size:16px; line-height:23px; font-weight:600; color:#17120E;\">Le texte descend avec le format<\u002Fspan>\n        <span style=\"font-size:14px; line-height:21px; color:#3A3128; text-wrap:pretty;\">Nom en 28 sur un héros, 22 sur une bande, 19 sur un duo, 15 sur un triptyque. En dessous de 15, le nom seul reste et la prestation tombe — un triptyque ne porte jamais trois lignes.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"box-sizing:border-box; background:#EDE6DE; border-left:3px solid #17120E; padding:22px 24px; display:flex; flex-direction:column; gap:9px;\">\n        <span style=\"font-size:16px; line-height:23px; font-weight:600; color:#17120E;\">Aucune valeur en argent<\u002Fspan>\n        <span style=\"font-size:14px; line-height:21px; color:#3A3128; text-wrap:pretty;\">Dans les six cadres. Ce qui tiendrait la place d'un prix ailleurs est ici la durée et la contrepartie : « 45 min · one story ». C'est ce qu'une créatrice engage, et la seule grandeur comparable du produit.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
