[project]
name = "bind-api"
version = "0.1.0"
description = "BIND — API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "tzdata>=2024.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    # Dépôt d'objets compatible S3. Seul le mode « s3 » l'utilise, et l'import
    # est fait dans la méthode : le développement local n'en a pas besoin, mais
    # une dépendance optionnelle non déclarée se découvre en production.
    "aioboto3>=13.0",
    # Téléversement de capture : FastAPI lève au démarrage sans lui, et le
    # message ne parle que de « form data ».
    "python-multipart>=0.0.9",
    # Lecture d'une base géographique MMDB locale, pour résoudre une adresse IP
    # en ville **sans la transmettre à personne**. MIT. Une API hébergée ferait
    # exactement l'inverse de ce qu'on cherche : envoyer l'adresse à un tiers.
    "maxminddb>=2.6",
    # Réduit les images **au dépôt**, jamais au service : la route des médias
    # continue de ne faire que servir des octets déjà rangés. Le semis s'en
    # servait déjà pour les photos de démonstration ; c'est le même mécanisme,
    # étendu au produit. Absente, on dépose l'original — dégradé, pas cassé.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Le parallélisme de la suite. `loadgroup` est ce qui le rend possible ici :
    # il permet d'épingler un groupe de tests sur un même worker, et c'est ce
    # qui préserve les tests de concurrence — voir `xdist_group` dans conftest.
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Fichiers produits par l'autogénération Alembic : on relit leur contenu, pas
# leur mise en forme. Les règles de fond (imports inutilisés, bugs) restent.
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `--strict-markers` : une marque mal orthographiée devient une erreur au lieu
# d'un avertissement. Sans elle, `@pytest.mark.ecrit_pour_de_bonn` désactiverait
# silencieusement rien du tout, et la garde passerait pour capricieuse.
# `-n auto` : un worker par cœur moins deux, ce que xdist calcule lui-même.
# `--dist loadgroup` : les tests d'un même `xdist_group` atterrissent sur le
# même worker. C'est ce qui rend le parallélisme possible ici — sans lui, deux
# tests de verrou consultatif partiraient sur deux bases différentes et
# n'auraient plus rien à sérialiser.
#
# Se désactive par `-p no:xdist` quand on veut lire une trace sans entrelacement.
addopts = "--strict-markers -n auto --dist loadgroup"
markers = [
    "ecrit_pour_de_bon(raison): le test valide ses écritures et les nettoie lui-même. Réservé à ce qui ne peut pas vivre dans une transaction annulée — deux transactions réellement concurrentes, un verrou consultatif. Dispense de la garde anti-fuite, et la raison est obligatoire",
    "xdist_group(nom): épingle le test sur un worker. Les tests qui écrivent pour de bon partagent le groupe `concurrence` : ils restent sériels entre eux, et le reste de la suite se parallélise",
    "lent(raison): déclare qu'un test est long et pourquoi. **La garde qui s'en servait a été retirée** : elle a fait échouer l'intégration continue quatre fois en une soirée — calibrée sur ma machine, puis incapable de traverser les processus sous xdist — sans jamais trouver autre chose qu'elle-même. La marque reste, inerte : elle documente les deux tests du semis, et la retirer ferait échouer `--strict-markers` sur des décorateurs qu'il n'y a aucune raison de toucher",
]

[tool.setuptools.package-data]
"app" = ["locales/*.json"]
