[project]
name = "bind-api"
version = "0.1.0"
description = "BIND — API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "tzdata>=2024.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    # Dépôt d'objets compatible S3. Seul le mode « s3 » l'utilise, et l'import
    # est fait dans la méthode : le développement local n'en a pas besoin, mais
    # une dépendance optionnelle non déclarée se découvre en production.
    "aioboto3>=13.0",
    # Téléversement de capture : FastAPI lève au démarrage sans lui, et le
    # message ne parle que de « form data ».
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Fichiers produits par l'autogénération Alembic : on relit leur contenu, pas
# leur mise en forme. Les règles de fond (imports inutilisés, bugs) restent.
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
"app" = ["locales/*.json"]
