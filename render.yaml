# Environnement de démonstration — déclaration du service chez Render.
#
# **Aucune valeur de secret ici.** Ce fichier déclare les *noms* des variables
# et laisse leurs valeurs au tableau de bord : `sync: false` demande à Render de
# ne jamais les lire du dépôt et de les demander au premier déploiement. Un
# secret dans un dépôt reste dans son historique même effacé.
#
# **La base n'est pas déclarée ici.** Elle vit chez Supabase, avec PostGIS et le
# stockage objet. La base gratuite de Render expire au bout de trente jours puis
# est supprimée, ce qui en fait le mauvais endroit pour une démonstration censée
# durer.
#
# **Le service est en `starter`, et c'est une mesure qui l'a décidé.** Sur le
# palier gratuit, la campagne a rapporté la lenteur comme premier grief. Le
# réseau n'y était pour rien — 17 ms de connexion TCP+TLS. Ce qui coûtait :
#
#   - **171 ms de péage sur chaque requête**, avant toute logique, mesurés sur
#     une 404 qui ne touche pas la base. C'est le demi-processeur ;
#   - **1,9 s sur `POST /auth/login`**, du hachage de mot de passe calibré pour
#     un processeur entier et exécuté sur la moitié. C'était le premier écran ;
#   - la mise en veille au bout de quinze minutes, une minute pour repartir —
#     donc systématique devant qui ouvre l'application sans prévenir.
#
# Ce que `starter` ne corrige pas : les **~195 ms par aller-retour vers la
# base**, qui viennent de la distance entre ce service et Supabase. Autre
# levier, autre décision.

services:
  - type: web
    name: bind-api-demo
    runtime: docker
    plan: starter
    region: oregon
    rootDir: api
    dockerfilePath: ./Dockerfile

    # Render interroge cette adresse pour savoir si le service est vivant. La
    # nôtre vérifie réellement la base : un service qui répond 200 avec une base
    # morte se déclare en bonne santé et sert des erreurs.
    healthCheckPath: /api/v1/health

    # La branche déployée. Chaque fusion sur `main` redéploie.
    branch: main
    autoDeployTrigger: commit

    envVars:
      - key: ENVIRONMENT
        value: demo

      # --- ce qui distingue la démonstration -------------------------------
      #
      # Le fournisseur social reste simulé : la démonstration ne doit pas
      # dépendre d'une application Meta en revue, ni consommer son quota.
      - key: SOCIAL_PROVIDER
        value: demo
      - key: EMAIL_PROVIDER
        value: log
      - key: BILLING_PROVIDER
        value: log
      - key: GEOCODING_PROVIDER
        value: manual

      # --- dépôt d'objets --------------------------------------------------
      #
      # Deux compartiments distincts, jamais un seul avec un filtre de préfixe :
      # un compartiment public s'énumère, et les preuves y seraient listables.
      - key: OBJECT_STORE_PROVIDER
        value: s3
      - key: OBJECT_STORE_REGION
        value: auto
      - key: OBJECT_STORE_BUCKET_PUBLIC
        sync: false
      - key: OBJECT_STORE_BUCKET_PRIVE
        sync: false
      - key: OBJECT_STORE_ENDPOINT
        sync: false
      - key: OBJECT_STORE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORE_SECRET_KEY
        sync: false

      # --- secrets et adresses ---------------------------------------------
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # L'origine de l'app publiée, et elle seule. Une liste large annulerait
      # l'intérêt du contrôle.
      - key: CORS_ORIGINS
        sync: false

      # La base que le jeu de données accepte de détruire, nommée
      # explicitement. Sans elle, la commande refuse de tourner ici.
      - key: SEED_DATABASE_NAME
        sync: false

      # L'adresse publique où s'ouvre un lien de prise en main. Sans elle,
      # `emettre` refuse — un lien sans adresse ne mène nulle part — et l'écran
      # de tournée reste vide, ce qui a été le cas jusqu'ici.
      - key: HANDOVER_BASE_URL
        sync: false

  # --------------------------------------------------------------------------
  # Le service de fond
  # --------------------------------------------------------------------------
  #
  # **Séparé du web, et c'est la seule forme qui marche.** Rien n'exécutait la
  # file : les emails se déposaient dans la boîte d'envoi et personne ne la
  # vidait. Une inscription écrivait donc une ligne en base et n'envoyait rien.
  #
  # **`boucle` et non `run`.** `run` fait un passage puis rend la main — c'est
  # ce qu'il faut à un cron, et exactement ce qu'un service de fond ne supporte
  # pas : il redémarrerait sans fin, et Render finirait par le déclarer mort.
  # `boucle` replanifie et exécute toutes les trente secondes, et survit à une
  # erreur de passage plutôt que de s'arrêter jusqu'au prochain déploiement.
  #
  # **Les mêmes variables que le web, moins celles qui ne le regardent pas.**
  # Pas de `CORS_ORIGINS` — il ne répond à personne. Pas de
  # `SEED_DATABASE_NAME` — il ne sème pas. Mais `EMAIL_PROVIDER` et sa clé, qui
  # sont sa raison d'être.
  - type: worker
    name: bind-worker-demo
    runtime: docker
    plan: starter
    region: oregon
    rootDir: api
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeployTrigger: commit

    envVars:
      # **Ce qui fait de ce service un worker.** L'image décide sur cette
      # variable plutôt que sur une commande passée au conteneur : une surcharge
      # de commande vit dans le tableau de bord, pas dans l'image, et un service
      # créé à la main n'en a aucune. Elle se copie avec les autres variables,
      # ce qu'on fait déjà.
      - key: SERVICE_ROLE
        value: worker

      - key: ENVIRONMENT
        value: demo

      - key: SOCIAL_PROVIDER
        value: demo
      - key: BILLING_PROVIDER
        value: log
      - key: GEOCODING_PROVIDER
        value: manual

      # **Ici, et pas `log`.** C'est ce service qui envoie ; le laisser en
      # journal reviendrait à déployer un facteur qui lit les lettres à voix
      # haute. La clé vient du tableau de bord.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      - key: OBJECT_STORE_PROVIDER
        value: s3
      - key: OBJECT_STORE_REGION
        value: auto
      - key: OBJECT_STORE_BUCKET_PUBLIC
        sync: false
      - key: OBJECT_STORE_BUCKET_PRIVE
        sync: false
      - key: OBJECT_STORE_ENDPOINT
        sync: false
      - key: OBJECT_STORE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORE_SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: HANDOVER_BASE_URL
        sync: false
