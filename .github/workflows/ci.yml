name: CI

on:
  # `push` limité à `main` : sur une branche de travail ouverte en PR,
  # l'événement `pull_request` valide déjà exactement le même code. Sans cette
  # restriction, chaque poussée déclenchait **deux** exécutions, donc quatre
  # jobs concurrents dont deux strictement redondants.
  #
  # Ce n'est pas ce qui a fait tomber la CI le 6 août — GitHub Actions était en
  # panne majeure ce jour-là, et des jobs restaient quinze minutes sans obtenir
  # de runner. Mais doubler la charge nous rendait deux fois plus exposés à ce
  # genre d'épisode, et l'autre moitié ne servait à rien.
  push:
    branches: [main]
  pull_request:

# Une seule exécution vivante par référence. Une poussée qui en suit une autre
# annule la précédente au lieu de se mettre en file derrière elle : la file
# était la cause de l'abandon, pas la lenteur des tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      db:
        # Même image qu'en local : ce qui passe ici passe sur la machine du dev.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bind
          POSTGRES_PASSWORD: bind
          POSTGRES_DB: bind
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bind -d bind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://bind:bind@localhost:5434/bind
      TEST_DATABASE_URL: postgresql+psycopg://bind:bind@localhost:5434/bind_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Générée par run plutôt que fixée dans le fichier : le dépôt est public,
      # et une clé de signature commitée finit toujours par être réutilisée
      # ailleurs. Elle ne sert qu'à la durée de ce job.
      - name: Clés éphémères
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Ruff
        working-directory: api
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        working-directory: api
        run: pytest -q

      # Le contrat que l'app vérifie est un fichier commité. S'il n'est pas
      # régénéré, le test de routes côté app continue de passer contre une
      # photographie périmée du serveur : il cesse de prouver quoi que ce soit
      # au moment précis où une route est renommée. On le régénère ici et on
      # refuse la différence.
      - name: Contrat d'API à jour
        working-directory: api
        run: |
          python scripts/dump_openapi.py
          git diff --exit-code -- ../app/src/api/openapi.json \
            || { echo "::error::app/src/api/openapi.json est périmé — lancez api/scripts/dump_openapi.py"; exit 1; }

  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        working-directory: app
        run: npm ci

      - name: Types
        working-directory: app
        run: npx tsc --noEmit

      # Le test des catalogues lit api/app/core/errors.py : il a besoin du
      # dépôt entier, pas seulement du dossier app.
      - name: Jest
        working-directory: app
        run: npx jest --ci

  # ------------------------------------------------------------------------
  # Bout en bout, dans un vrai navigateur
  # ------------------------------------------------------------------------
  #
  # **Le seul job qui monte le produit entier.** Les deux autres éprouvent
  # chacun leur moitié avec des doubles ; celui-ci lance une vraie base, une
  # vraie API, le build web réel, et un navigateur. Trois défauts n'ont été
  # trouvés que par l'œil de quelqu'un qui ouvrait l'app — la vidéo qui ne
  # jouait pas, les polices jamais chargées, la barre latérale jamais montée.
  # Aucun n'était visible d'un test unitaire, et aucun ne l'aurait jamais été.
  e2e:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bind
          POSTGRES_PASSWORD: bind
          POSTGRES_DB: bind
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bind -d bind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://bind:bind@localhost:5434/bind
      SEED_DATABASE_NAME: bind
      # Le serveur statique sert sur cette origine. Sans elle dans la liste,
      # chaque requête part et revient en échec CORS — l'app affiche alors des
      # écrans vides sans qu'aucune erreur ne remonte. C'est le premier défaut
      # que ce job a trouvé, et il n'était visible que d'un navigateur.
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      E2E_WEB_PORT: 4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Clés éphémères
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Dépendances API
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dépendances app
        working-directory: app
        run: npm ci

      # Les vraies vidéos ne sont pas versionnées — elles pèsent plusieurs
      # mégaoctets. Sans fichier, le semis ne pose aucune clé et l'accueil
      # n'affiche pas de lecteur : le test mesurerait alors l'absence d'un
      # fichier plutôt que notre code.
      #
      # Deux fixtures de trois kilooctets, noires, deux secondes, versionnées.
      # Elles traversent exactement le même chemin que les vraies — semis,
      # dépôt objet, route de média, lecteur. **Fabriquées ici par ffmpeg dans
      # une première version, ce qui a échoué : le runner ne l'a pas.** Une
      # fixture versionnée ne dépend de rien.
      - name: Vidéo d'accueil de test
        run: |
          mkdir -p assets/photos/accueil
          cp app/e2e/fixtures/video-paysage.mp4 assets/photos/accueil/video.mp4
          cp app/e2e/fixtures/video-portrait.mp4 assets/photos/accueil/video-portrait.mp4

      - name: Migrations et jeu de données
        working-directory: api
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Démarrer l'API
        working-directory: api
        run: |
          uvicorn app.main:app --port 8010 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8010/api/v1/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::l'API n'a pas démarré"; cat /tmp/api.log; exit 1

      # L'adresse est **gravée dans le bundle** au moment de l'export : la
      # poser plus tard n'aurait aucun effet.
      - name: Build web
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8010/api/v1
        run: npx expo export --platform web --output-dir dist-e2e

      - name: Navigateur
        working-directory: app
        run: npx playwright install --with-deps chrome

      - name: Playwright
        working-directory: app
        run: npx playwright test

      # La trace du premier échec : c'est elle qui permet de voir ce que le
      # navigateur voyait, sans avoir à reproduire la CI sur sa machine.
      - name: Traces des échecs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-e2e
          path: app/test-results/
          retention-days: 7

      - name: Journal de l'API
        if: failure()
        run: cat /tmp/api.log
