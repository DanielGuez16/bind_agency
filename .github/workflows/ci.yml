name: CI

on:
  # `push` limité à `main` : sur une branche de travail ouverte en PR,
  # l'événement `pull_request` valide déjà exactement le même code. Sans cette
  # restriction, chaque poussée déclenchait **deux** exécutions, donc quatre
  # jobs concurrents dont deux strictement redondants.
  #
  # Ce n'est pas ce qui a fait tomber la CI le 6 août — GitHub Actions était en
  # panne majeure ce jour-là, et des jobs restaient quinze minutes sans obtenir
  # de runner. Mais doubler la charge nous rendait deux fois plus exposés à ce
  # genre d'épisode, et l'autre moitié ne servait à rien.
  push:
    branches: [main]
  pull_request:

# Une seule exécution vivante par référence. Une poussée qui en suit une autre
# annule la précédente au lieu de se mettre en file derrière elle : la file
# était la cause de l'abandon, pas la lenteur des tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  # Ce que la modification touche
  # ------------------------------------------------------------------------
  #
  # **Le job reste, seul son contenu se court-circuite.** `main` exige `api`,
  # `app` et `e2e` : un job sauté par une condition de job ne rapporte jamais
  # rien, la fusion l'attend indéfiniment, et la protection se retourne contre
  # elle-même. La condition est donc posée sur les **étapes** — le job démarre,
  # ne fait rien, et sort en vert en quelques secondes.
  #
  # **En cas de doute, on exécute tout.** Une base de comparaison introuvable,
  # un `git diff` en échec, un événement inattendu : le repli est « tout a
  # changé ». Un court-circuit qui se trompe dans l'autre sens laisserait passer
  # exactement ce qu'il prétend vérifier, et personne ne le saurait.
  perimetre:
    runs-on: ubuntu-latest
    # **Un plafond, parce que le défaut de GitHub est six heures.** Le pas
    # `Navigateur` de la e2e est resté cinquante minutes puis vingt-cinq sans
    # finir, sur deux exécutions consécutives — **sans échouer** : il
    # n'aboutissait pas. Rien ne distingue alors « ça installe » de « c'est
    # bloqué » : le run est `in_progress`, la PR `BLOCKED` en attente d'une
    # vérification requise, et tout se lit comme de la patience. C'est le
    # pendant exact du run jamais dispatché.
    #
    # Les bornes viennent de quatorze exécutions vertes, pas d'une intuition, et
    # elles sont **larges** : une borne trop serrée rend rouge du bon code un
    # jour où le runner traîne, ce qui est le défaut qu'on cherche à éviter, en
    # pire. Ce qu'on achète ici n'est pas de la vitesse, c'est qu'un blocage
    # devienne un échec net au lieu d'un runner immobilisé six heures.
    timeout-minutes: 10  # 9 s au pire sur quatorze exécutions : il ne fait que lire un diff
    outputs:
      api: ${{ steps.decider.outputs.api }}
      app: ${{ steps.decider.outputs.app }}
      e2e: ${{ steps.decider.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique entier : la base de comparaison d'une PR peut être
          # loin derrière, et une copie superficielle rendrait un diff faux
          # plutôt qu'une erreur.
          fetch-depth: 0

      - id: decider
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          tout() {
            echo "::notice::périmètre indéterminé ($1) — tout est exécuté"
            { echo "api=oui"; echo "app=oui"; echo "e2e=oui"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "${BASE:-}" ] || tout "aucune base de comparaison"
          # Une première poussée sur une branche neuve donne un SHA nul.
          [ "$BASE" != "0000000000000000000000000000000000000000" ] || tout "base nulle"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || tout "base $BASE inconnue"
          FICHIERS=$(git diff --name-only "$BASE"...HEAD) || tout "git diff en échec"

          echo "Fichiers modifiés :"; echo "$FICHIERS" | sed 's/^/  /'

          concerne() { echo "$FICHIERS" | grep -qE "$1"; }

          # L'intégration continue elle-même : si elle change, plus rien n'est
          # acquis sur ce qu'elle vérifiait.
          if concerne '^\.github/workflows/'; then tout "l'intégration continue a changé"; fi

          API=non; APP=non
          # `openapi.json` vit dans `app/` et **est le contrat que le job `api`
          # regénère et compare**. Le modifier seul doit donc réveiller `api`,
          # sans quoi une photographie périmée du serveur passerait.
          concerne '^api/|^app/src/api/openapi\.json$' && API=oui
          # Le test des catalogues lit `api/app/core/errors.py` : un code
          # d'erreur ajouté côté serveur doit faire tomber le job `app`.
          concerne '^app/|^api/app/core/errors\.py$' && APP=oui
          # Le seul job qui monte le produit entier : tout ce qui n'est pas de
          # la documentation le concerne.
          E2E=non; { [ "$API" = oui ] || [ "$APP" = oui ]; } && E2E=oui

          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"
          echo "::notice::api=$API app=$APP e2e=$E2E"

  api:
    needs: perimetre
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 632 s au pire — c'est le plus long des quatre, et il vient d'être raccourci

    services:
      db:
        # Même image qu'en local : ce qui passe ici passe sur la machine du dev.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bind
          POSTGRES_PASSWORD: bind
          POSTGRES_DB: bind
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bind -d bind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://bind:bind@localhost:5434/bind
      TEST_DATABASE_URL: postgresql+psycopg://bind:bind@localhost:5434/bind_test
      # Le parcours d'autorisation de démonstration revient ici. Sans elle, la
      # fabrique refuse plutôt que de rendre une adresse qui n'existe pas.
      API_PUBLIC_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4
        if: needs.perimetre.outputs.api == 'oui'

      - uses: actions/setup-python@v5
        if: needs.perimetre.outputs.api == 'oui'
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        if: needs.perimetre.outputs.api == 'oui'
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Générée par run plutôt que fixée dans le fichier : le dépôt est public,
      # et une clé de signature commitée finit toujours par être réutilisée
      # ailleurs. Elle ne sert qu'à la durée de ce job.
      - name: Clés éphémères
        if: needs.perimetre.outputs.api == 'oui'
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Ruff
        if: needs.perimetre.outputs.api == 'oui'
        working-directory: api
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        if: needs.perimetre.outputs.api == 'oui'
        working-directory: api
        run: pytest -q

      # Le contrat que l'app vérifie est un fichier commité. S'il n'est pas
      # régénéré, le test de routes côté app continue de passer contre une
      # photographie périmée du serveur : il cesse de prouver quoi que ce soit
      # au moment précis où une route est renommée. On le régénère ici et on
      # refuse la différence.
      - name: Contrat d'API à jour
        if: needs.perimetre.outputs.api == 'oui'
        working-directory: api
        run: |
          python scripts/dump_openapi.py
          git diff --exit-code -- ../app/src/api/openapi.json \
            || { echo "::error::app/src/api/openapi.json est périmé — lancez api/scripts/dump_openapi.py"; exit 1; }

  app:
    needs: perimetre
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 62 s au pire

    steps:
      - uses: actions/checkout@v4
        if: needs.perimetre.outputs.app == 'oui'

      - uses: actions/setup-node@v4
        if: needs.perimetre.outputs.app == 'oui'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        if: needs.perimetre.outputs.app == 'oui'
        working-directory: app
        run: npm ci

      - name: Types
        if: needs.perimetre.outputs.app == 'oui'
        working-directory: app
        run: npx tsc --noEmit

      # Le test des catalogues lit api/app/core/errors.py : il a besoin du
      # dépôt entier, pas seulement du dossier app.
      - name: Jest
        if: needs.perimetre.outputs.app == 'oui'
        working-directory: app
        run: npx jest --ci --json --outputFile=/tmp/jest.json

      # **Un fichier de test qui coûte dix fois ses voisins porte un défaut**,
      # et il ne fait échouer personne : la suite passe, la CI reste verte, et
      # le coût retombe dans chaque boucle de mutation. Ce que la garde attrape
      # et ce qu'elle ne peut pas attraper est écrit dans le script.
      - name: Durée des fichiers de test
        if: needs.perimetre.outputs.app == 'oui'
        working-directory: app
        run: node scripts/duree-des-tests.mjs /tmp/jest.json

  # ------------------------------------------------------------------------
  # Bout en bout, dans un vrai navigateur
  # ------------------------------------------------------------------------
  #
  # **Le seul job qui monte le produit entier.** Les deux autres éprouvent
  # chacun leur moitié avec des doubles ; celui-ci lance une vraie base, une
  # vraie API, le build web réel, et un navigateur. Trois défauts n'ont été
  # trouvés que par l'œil de quelqu'un qui ouvrait l'app — la vidéo qui ne
  # jouait pas, les polices jamais chargées, la barre latérale jamais montée.
  # Aucun n'était visible d'un test unitaire, et aucun ne l'aurait jamais été.
  e2e:
    needs: perimetre
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 308 s au pire, et c'est lui qui a bloqué deux fois

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bind
          POSTGRES_PASSWORD: bind
          POSTGRES_DB: bind
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U bind -d bind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://bind:bind@localhost:5434/bind
      SEED_DATABASE_NAME: bind
      # Le serveur statique sert sur cette origine. Sans elle dans la liste,
      # chaque requête part et revient en échec CORS — l'app affiche alors des
      # écrans vides sans qu'aucune erreur ne remonte. C'est le premier défaut
      # que ce job a trouvé, et il n'était visible que d'un navigateur.
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      E2E_WEB_PORT: 4173
      # **Un dépôt sur disque, partagé par le semis et l'API.** Le défaut par
      # configuration est `memory` : le semis y déposait les photos et les
      # vidéos, son processus se terminait, et l'API redémarrait sur un dépôt
      # vide. Toutes les clés existaient en base, aucun octet derrière — la
      # route de média répondait 404 sur tout, et le navigateur rapportait
      # « Format error », ce qui a d'abord fait chercher un codec. Deux
      # processus qui se passent des fichiers ont besoin d'un endroit commun.
      OBJECT_STORE_PROVIDER: local
      OBJECT_STORE_LOCAL_ROOT: /tmp/bind-objets-e2e

    steps:
      - uses: actions/checkout@v4
        if: needs.perimetre.outputs.e2e == 'oui'

      - uses: actions/setup-python@v5
        if: needs.perimetre.outputs.e2e == 'oui'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: needs.perimetre.outputs.e2e == 'oui'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Clés éphémères
        if: needs.perimetre.outputs.e2e == 'oui'
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Dépendances API
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dépendances app
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: app
        run: npm ci

      # Les vraies vidéos ne sont pas versionnées — elles pèsent plusieurs
      # mégaoctets. Sans fichier, le semis ne pose aucune clé et l'accueil
      # n'affiche pas de lecteur : le test mesurerait alors l'absence d'un
      # fichier plutôt que notre code.
      #
      # Deux fixtures de trois kilooctets, noires, deux secondes, versionnées.
      # Elles traversent exactement le même chemin que les vraies — semis,
      # dépôt objet, route de média, lecteur. **Fabriquées ici par ffmpeg dans
      # une première version, ce qui a échoué : le runner ne l'a pas.** Une
      # fixture versionnée ne dépend de rien.
      - name: Vidéo d'accueil de test
        if: needs.perimetre.outputs.e2e == 'oui'
        run: |
          mkdir -p assets/photos/accueil
          cp app/e2e/fixtures/video-paysage.mp4 assets/photos/accueil/video.mp4
          cp app/e2e/fixtures/video-portrait.mp4 assets/photos/accueil/video-portrait.mp4

      - name: Migrations et jeu de données
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: api
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Démarrer l'API
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: api
        run: |
          uvicorn app.main:app --port 8010 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8010/api/v1/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::l'API n'a pas démarré"; cat /tmp/api.log; exit 1

      # L'adresse est **gravée dans le bundle** au moment de l'export : la
      # poser plus tard n'aurait aucun effet.
      - name: Build web
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8010/api/v1
        run: npx expo export --platform web --output-dir dist-e2e

      - name: Navigateur
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: app
        run: npx playwright install --with-deps chrome

      - name: Playwright
        if: needs.perimetre.outputs.e2e == 'oui'
        working-directory: app
        run: npx playwright test

      # La trace du premier échec : c'est elle qui permet de voir ce que le
      # navigateur voyait, sans avoir à reproduire la CI sur sa machine.
      - name: Traces des échecs
        if: failure() && needs.perimetre.outputs.e2e == 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: traces-e2e
          path: app/test-results/
          retention-days: 7

      - name: Journal de l'API
        if: failure() && needs.perimetre.outputs.e2e == 'oui'
        run: cat /tmp/api.log
